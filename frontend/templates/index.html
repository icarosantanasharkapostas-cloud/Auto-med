<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Mediação Bot Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="fas fa-robot text-primary"></i> Mediação Manager</a>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sair</button>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Estatísticas -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card bg-secondary text-center p-3 shadow-sm border-0">
                    <h5 class="text-muted">Total Clientes</h5>
                    <h2 id="stat-total">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-secondary text-center p-3 shadow-sm border-0">
                    <h5 class="text-muted">Bots Ativos</h5>
                    <h2 id="stat-ativos" class="text-success">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-secondary text-center p-3 shadow-sm border-0">
                    <h5 class="text-muted">Salas Criadas</h5>
                    <h2 id="stat-salas" class="text-info">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-secondary text-center p-3 shadow-sm border-0">
                    <h5 class="text-muted">Pagamentos</h5>
                    <h2 id="stat-pgtos" class="text-warning">0</h2>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Lista de Clientes -->
            <div class="col-md-8">
                <div class="card bg-secondary shadow-sm border-0 mb-4">
                    <div class="card-header bg-secondary border-bottom border-dark d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="fas fa-users"></i> Clientes</h5>
                        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#clientModal">
                            <i class="fas fa-plus"></i> Novo Cliente
                        </button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-dark table-hover mb-0">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Nome</th>
                                        <th>Email (Pix)</th>
                                        <th>Status</th>
                                        <th>Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="clients-table-body">
                                    <!-- Preenchido via JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Logs Recentes -->
            <div class="col-md-4">
                <div class="card bg-secondary shadow-sm border-0">
                    <div class="card-header bg-secondary border-bottom border-dark">
                        <h5 class="mb-0"><i class="fas fa-terminal"></i> Logs do Sistema</h5>
                        <select id="log-client-filter" class="form-select form-select-sm bg-dark text-light border-dark mt-2">
                            <option value="">Selecione um cliente para ver os logs</option>
                        </select>
                    </div>
                    <div class="card-body p-0">
                        <div id="logs-container" class="p-3 bg-dark" style="height: 400px; overflow-y: auto; font-family: monospace; font-size: 0.85rem;">
                            <!-- Preenchido via JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Novo Cliente -->
    <div class="modal fade" id="clientModal" tabindex="-1" data-bs-theme="dark">
        <div class="modal-dialog">
            <div class="modal-content bg-secondary text-light">
                <div class="modal-header border-dark">
                    <h5 class="modal-title">Adicionar Novo Cliente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="newClientForm">
                        <div class="mb-3">
                            <label>Nome do Cliente</label>
                            <input type="text" id="c_nome" class="form-control bg-dark text-light border-dark" required>
                        </div>
                        <div class="mb-3">
                            <label>Token Discord (Self-Bot)</label>
                            <input type="password" id="c_token" class="form-control bg-dark text-light border-dark" required>
                        </div>
                        <div class="mb-3">
                            <label>Email Gmail (Para LER Pix)</label>
                            <input type="email" id="c_email" class="form-control bg-dark text-light border-dark">
                        </div>
                        <div class="mb-3">
                            <label>Senha de App Gmail</label>
                            <input type="password" id="c_senha_email" class="form-control bg-dark text-light border-dark">
                            <small class="text-muted">A senha de app gerada no Google (16 letras).</small>
                        </div>
                        <hr class="border-dark">
                        <h6>Configurações Específicas</h6>
                        <div class="mb-3">
                            <label>Prefixo de Comando</label>
                            <input type="text" id="c_prefix" class="form-control bg-dark text-light border-dark" value="!">
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label>ID Categoria Salas</label>
                                <input type="text" id="c_cat" class="form-control bg-dark text-light border-dark">
                            </div>
                            <div class="col-6 mb-3">
                                <label>ID Cargo Mediador</label>
                                <input type="text" id="c_cargo" class="form-control bg-dark text-light border-dark">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Salvar Cliente</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
