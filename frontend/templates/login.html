<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mediação Bot Manger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center vh-100">
    <div class="card bg-secondary text-light p-4 shadow" style="width: 350px;">
        <h3 class="text-center mb-4">Admin Login</h3>
        <form id="loginForm">
            <div class="mb-3">
                <label>Usuário</label>
                <input type="text" id="username" class="form-control bg-dark text-light border-secondary" required>
            </div>
            <div class="mb-3">
                <label>Senha</label>
                <input type="password" id="password" class="form-control bg-dark text-light border-secondary" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
        <div id="errorMsg" class="text-danger mt-3 text-center" style="display: none;">Credenciais inválidas</div>
    </div>

    <script src="/static/login.js"></script>
</body>
</html>
